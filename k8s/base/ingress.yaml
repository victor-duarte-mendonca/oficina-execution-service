# Roteamento por prefixo no Traefik (spec 12 §5): /admin/executions vem para cá; o resto continua no OS
# Service (Ingress "/" do oficina-app). O Traefik prioriza a regra mais longa, então os dois convivem.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina-execution-ingress
  namespace: oficina
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /admin/executions
            pathType: Prefix
            backend:
              service:
                name: oficina-execution
                port:
                  name: http

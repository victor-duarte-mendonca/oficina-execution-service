# Menor privilégio de rede: entra só o Traefik (e o kubelet, pelas probes); sai só DNS, HTTPS (APIs da AWS:
# DynamoDB e SQS, e o OTLP do New Relic) e o IMDS da EC2, de onde vêm as credenciais do LabRole (ADR 0022).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oficina-execution
  namespace: oficina
spec:
  podSelector:
    matchLabels:
      app: oficina-execution
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80

# ===================================================
# Execution Service — fila de execução da OS (Fase 4, specs/fase4/06 no oficina-app)
# ===================================================
quarkus.application.name=oficina-execution-service
quarkus.http.port=8080

# JWT: o mesmo emissor e a mesma chave pública do OS e do Lambda (ADR 0006).
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:keys/publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:oficina-api}

# Chave que o API Gateway injeta em X-Gateway-Key. Vazia = filtro desligado (dev/test/docker).
app.gateway.key=${APP_GATEWAY_KEY:}

# AWS (DynamoDB e SQS). Credenciais pela cadeia padrão do SDK: IMDS no k3s (ADR 0022), variáveis em dev.
app.aws.region=${AWS_REGION:us-east-1}
app.aws.endpoint-override=${AWS_ENDPOINT_OVERRIDE:}
app.dynamodb.table=${DYNAMODB_TABLE:oficina-local-execution}
app.dynamodb.create-table=${DYNAMODB_CREATE_TABLE:false}

# Mensageria: desligada sem as filas configuradas (dev sem AWS).
app.messaging.enabled=${APP_MESSAGING_ENABLED:false}
app.messaging.queues.commands=${SQS_EXECUTION_COMMANDS_URL:}
app.messaging.queues.os-replies=${SQS_OS_REPLIES_URL:}

# OpenAPI
quarkus.smallrye-openapi.info-title=Oficina — Execution Service
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=false

# Jackson
quarkus.jackson.serialization-inclusion=non_null
quarkus.jackson.write-dates-as-timestamps=false

# Observabilidade: métricas em /q/metrics, health em /q/health, traces OTLP (desligados sem licença).
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:https://otlp.nr-data.net:4317}
quarkus.otel.exporter.otlp.traces.headers=api-key=${NEW_RELIC_LICENSE_KEY:unset}
quarkus.otel.resource.attributes=service.namespace=oficina,deployment.environment=${APP_ENV:local}
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:1.0}

# Logs
quarkus.log.level=INFO
%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.additional-field."service.name".value=${quarkus.application.name}
%prod.quarkus.log.console.json.additional-field."env".value=${APP_ENV:prod}

# ===================================================
# Teste: LocalStack (DynamoDB + SQS) sobe pelo LocalStackResource; agendamentos acionados pelos testes.
# ===================================================
%test.mp.jwt.verify.publickey.location=test-keys/publicKey.pem
%test.smallrye.jwt.sign.key.location=test-keys/privateKey.pem
%test.app.dynamodb.table=oficina-test-execution
%test.app.dynamodb.create-table=true
%test.quarkus.scheduler.enabled=false

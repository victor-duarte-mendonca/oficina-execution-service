name: CI

# Pipeline independente do Execution Service (spec 11, R12): build, testes (unidade, contrato, LocalStack), gate de
# cobertura e imagem em todo PR/push. O deploy no k3s entra com a infraestrutura das filas e da tabela (spec 12).
on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # O Testcontainers do BOM do Quarkus 3.15 negocia a API Docker 1.32; o Docker dos runners exige >= 1.40.
      - name: Fixar a versão da API do Docker para o Testcontainers
        run: echo "api.version=1.44" > "$HOME/.docker-java.properties"
      - name: mvn verify (testes + gate JaCoCo)
        run: mvn -B --no-transfer-progress verify
      - name: Publicar relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  docker-build:
    name: docker-build
    needs: [build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: oficina-execution-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan da imagem (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: oficina-execution-service:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest
      - name: shellcheck dos scripts
        run: shellcheck scripts/*.sh
      - name: kustomize dos overlays
        run: |
          for env in hml prod; do
            kubectl kustomize "k8s/overlays/${env}" > "/tmp/${env}.yaml"
          done
          if grep -q '^kind: Secret' /tmp/hml.yaml /tmp/prod.yaml; then
            echo "::error::Secret encontrado na saída do kustomize"
            exit 1
          fi
